<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RustScope</title><style>:root{--a:#f97316}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f8fb;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#08090dee;backdrop-filter:blur(12px);border-bottom:1px solid #282e38;padding:16px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{color:white;text-decoration:none;font-weight:900}.brand small{display:block;color:#7f8999;font-size:10px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#98a2b2;text-decoration:none;padding:9px 12px;border-radius:9px}nav a:hover{background:var(--a);color:#fff}main{max-width:1180px;margin:auto;padding:60px 5vw}h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0 0 15px}p{color:#9ca5b4;line-height:1.7}.heroimg{height:190px;border-radius:18px;background:linear-gradient(135deg,var(--a),#151922);display:grid;place-items:center;font-size:70px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.grid>div,.card,.balance{background:#0f1218;border:1px solid #29303a;border-radius:16px;padding:20px}.grid b,.balance b{display:block;font-size:30px;margin-top:9px}.list{border:1px solid #29303a;border-radius:16px;overflow:hidden;margin-top:18px}.list>div{padding:15px 18px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;gap:12px}.chart{height:270px;display:flex;align-items:end;gap:7px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}button{border:0;background:var(--a);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}input,select,textarea{display:block;width:100%;background:#0a0d12;border:1px solid #303744;color:#fff;border-radius:9px;padding:11px;margin:7px 0 14px}pre{color:#bfc8d5;white-space:pre-wrap}@media(max-width:760px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ RustScope<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Analyzer</a><a href="?view=1">Files</a><a href="?view=2">Directory</a><a href="?view=3">Help</a></nav></header><main id="app"></main><script>let files=JSON.parse(localStorage.rustFiles||'[{"name":"README.md","text":"Rust CLI Tool\nAnalyze files quickly."},{"name":"src/main.rs","text":"fn main() { println!(\"hello\"); }"}]');function render(){let v=+(new URLSearchParams(location.search).get('view')||0);app.innerHTML=v===0?'<h1>Analyze files like a CLI.</h1><p>Masukkan teks dan lihat lines, words, chars.</p><textarea id="text" rows="8" placeholder="Paste file content..."></textarea><button onclick="analyze()">Analyze</button><div id="result"></div>':v===1?'<h1>Files</h1><form onsubmit="return addF(event)"><input id="fname" placeholder="Filename" required><textarea id="ftext" placeholder="Content" required></textarea><button>Add file</button></form>'+files.map((f,i)=>'<div class="card">'+f.name+' <button onclick="inspect('+i+')">Analyze</button><button onclick="files.splice('+i+',1);save();render()">Delete</button></div>').join(''):v===2?'<h1>Directory</h1><div class="grid"><div><small>FILES</small><b>'+files.length+'</b></div><div><small>WORDS</small><b>'+files.reduce((a,x)=>a+x.text.trim().split(/\s+/).filter(Boolean).length,0)+'</b></div></div>':'<h1>CLI Help</h1><div class="card"><pre>rustscope &lt;path&gt;\nrustscope README.md\nrustscope src/</pre></div>'}function analyze(){let t=text.value;result.innerHTML='<div class="card">Lines: '+(t? t.split(/\n/).length:0)+' · Words: '+t.trim().split(/\s+/).filter(Boolean).length+' · Chars: '+t.length+'</div>'}function inspect(i){text.value=files[i].text;location.search='?view=0'}function addF(e){e.preventDefault();files.push({name:fname.value,text:ftext.value});save();render();return false}function save(){localStorage.rustFiles=JSON.stringify(files)}render();</script></body></html>
